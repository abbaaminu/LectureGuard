name: Build & Verify LectureGuard

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flutter-and-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: flutter_app
        run: flutter analyze --no-pub lib test

      - name: Run Flutter tests
        working-directory: flutter_app
        run: flutter test --no-pub

      - name: Check release signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not available; the APK will be debug-signed and cannot be published."
          fi

      - name: Decode Android signing keystore & key.properties
        if: steps.signing.outputs.available == 'true'
        working-directory: flutter_app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build, verify and checksum release APKs
        working-directory: flutter_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash tool/build_release_apks.sh

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lectureguard-release-apk
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
            flutter_app/build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 14

      - name: Publish APKs to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            flutter_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
            flutter_app/build/app/outputs/flutter-apk/SHA256SUMS.txt
          generate_release_notes: true

  supabase-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lectureguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lectureguard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Run RLS integration tests
        env:
          PGPASSWORD: postgres
        run: >-
          psql -X -v ON_ERROR_STOP=1
          -h localhost -U postgres -d lectureguard_test
          -f supabase/tests/rls_test.sql