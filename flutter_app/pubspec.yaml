name: lecture_guard
description: Offline-first biometric lecture attendance and high school reporting app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  supabase_flutter: ^2.8.0
  connectivity_plus: ^6.1.0
  crypto: ^3.0.6
  uuid: ^4.5.1
  intl: ^0.19.0
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.13.4
  workmanager: ^0.7.0
  cryptography: ^2.9.0
  fl_chart: 0.70.2
  share_plus: 10.1.4
  diacritic: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4+4
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/branding/app_icon.png
